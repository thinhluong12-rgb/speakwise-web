.sw-today-main{min-width:0;display:flex;flex-direction:column;justify-content:center}
.sw-today-header{display:block;margin-bottom:13px}
.sw-today-header h2{margin:8px 0 0}
.sw-goal-label{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:310px;margin:8px 0 15px;font-size:13px}
.sw-goal-label select{min-width:112px}
.sw-today .sw-daily-label{margin:5px 0 9px}
.sw-today-actions{margin-top:17px}
.sw-today-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;align-content:center}
.sw-today-side .sw-stat{min-width:0;padding:15px 13px;margin:0;border-radius:14px}
.sw-today-side .sw-stat .sw-stat-icon{width:35px;height:35px;margin-bottom:8px}
.sw-today-side .sw-stat .sw-stat-icon svg{width:20px;height:20px}
.sw-today-side .sw-stat strong{font-size:25px}
.sw-today-side .sw-stat strong small{font-size:11px}
.sw-today-side .sw-stat p{font-size:12px;margin:5px 0 0}
.sw-week-panel{margin-top:20px;min-height:0}
.sw-week-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sw-week-heading h3{margin-bottom:12px}
.sw-week-heading span{font-size:12px;color:#78928a}
.sw-week{height:170px}
.sw-bar-day>div>i{transition:height .2s ease,background .2s ease}
.sw-learning-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sw-learning-tabs button{min-width:0;white-space:nowrap;justify-content:center}
.sw-learning-tabs button svg{width:18px;height:18px}
.sw-flashcard .sw-card-phrase{font-size:clamp(31px,3.8vw,48px)!important}
.sw-flashcard .sw-card-meaning{font-size:clamp(23px,2.8vw,34px)!important}
.sw-card-example{font-size:clamp(17px,1.9vw,21px)!important}
.sw-prompt h2{font-size:clamp(25px,2.8vw,38px)!important}
.sw-review-empty{text-align:center;padding:clamp(32px,6vw,70px) 20px}
.sw-review-empty>svg{width:44px;height:44px;color:#278c78;margin-bottom:12px}
.sw-review-empty h2{font-size:25px;color:#205f54}
.sw-review-empty p{max-width:560px;margin:0 auto 20px;color:#69877c;line-height:1.7}
.sw-review-session-head{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px;color:#6b8b80;font-size:12px;font-weight:800;letter-spacing:.07em}
.sw-review-prompt{min-height:250px}
.sw-review-actions{text-align:center;padding:22px 12px}
.sw-review-actions p{color:#6b867e;margin:0 0 14px}
.sw-review-answer{margin-top:18px;padding:clamp(18px,3vw,28px);border:1px solid #dcebe4;background:#f9fcfa;border-radius:16px;text-align:center}
.sw-review-answer h2{font-size:clamp(27px,3vw,39px);color:#206d5d;margin:0 0 8px}
.sw-review-answer>p{color:#6e8b81}
.sw-review-answer .sw-card-example{margin:14px auto;max-width:720px;line-height:1.7;color:#355c53}
.sw-review-ratings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:20px}
.sw-review-ratings .rating-btn{min-width:0;padding:12px 8px}
.sw-ai-hint-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:13px 15px;background:#f4faf6;border:1px solid #dcece4;border-radius:13px}
.sw-ai-hint-button{display:inline-flex;align-items:center;gap:8px;flex:none;border-color:#b9dccc;color:#267865;background:#fff}
.sw-ai-hint-button svg{width:18px;height:18px}
.sw-ai-hint-box>span{font-size:13px;color:#66867b;line-height:1.5}
.sw-ai-hint-loading,.sw-ai-hint-error{padding:12px 14px;margin:10px 0;border-radius:11px;font-size:14px}
.sw-ai-hint-loading{background:#f2f8fc;color:#4e7487}
.sw-ai-hint-error{background:#fff4ed;color:#9c5b39}
.sw-ai-hint-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 18px}
.sw-ai-hint-title{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:750;color:#397667}
.sw-ai-hint-title svg{width:18px;height:18px}
.sw-ai-hint-card{padding:14px;border:1px solid #dcebe4;border-radius:12px;background:#fff}
.sw-ai-hint-card>strong{display:block;font-size:14px;color:#285e52;margin-bottom:9px}
.sw-ai-keywords{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.sw-ai-keywords span{padding:4px 8px;background:#edf7f1;border-radius:20px;font-size:12px;color:#347566}
.sw-ai-hint-card p{margin:0;color:#688379;font-size:13px;line-height:1.6}
@media(max-width:900px){
 .sw-today-layout{grid-template-columns:1fr}
 .sw-today-side{grid-template-columns:repeat(4,minmax(0,1fr))}
 .sw-today-side .sw-stat{padding:12px 10px}
 .sw-ai-hint-results{grid-template-columns:1fr}
}
@media(max-width:650px){
 .sw-today{padding:17px}
 .sw-today-side{grid-template-columns:repeat(2,minmax(0,1fr))}
 .sw-learning-tabs{gap:4px;padding:5px}
 .sw-learning-tabs button{font-size:12px;padding:11px 3px;gap:5px}
 .sw-learning-tabs button svg{width:15px;height:15px}
 .sw-review-ratings{grid-template-columns:repeat(2,minmax(0,1fr))}
 .sw-ai-hint-box{align-items:flex-start}
 .sw-ai-hint-button{width:100%;justify-content:center}
}


/* SpeakWise logo asset */
.brand-mark{overflow:hidden;padding:0;background:transparent;letter-spacing:0}
.brand-mark img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.mobile-logo img{display:block;width:32px;height:32px;object-fit:cover;border-radius:9px;flex:none}

/* Speaking Lab */
.sw-speaking-lab{max-width:1280px;margin:0 auto}
.sw-sl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.sw-sl-head h1{font-size:clamp(25px,3vw,34px);line-height:1.2;letter-spacing:-.7px;margin:5px 0 7px;color:#183d43}
.sw-sl-head p{margin:0;color:#789096;font-size:14px}
.sw-sl-status{display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #dcece6;border-radius:30px;background:#fff;color:#438476;font-size:12px;font-weight:750;white-space:nowrap}
.sw-sl-status i{width:7px;height:7px;border-radius:50%;background:#35aa83}
.sw-sl-toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px;background:#fff;border:1px solid #e2ece8;border-radius:15px;margin-bottom:14px}
.sw-sl-field{display:grid;gap:4px;min-width:170px;flex:1}
.sw-sl-field label{font-size:10px;font-weight:850;color:#8aa097;letter-spacing:.08em;text-transform:uppercase}
.sw-sl-field select{width:100%;height:40px;border:1px solid #e0eae6;border-radius:9px;padding:0 11px;background:#fbfdfc;color:#315c55;font-weight:650}
.sw-sl-shell{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:stretch}
.sw-sl-chat{min-width:0;display:flex;flex-direction:column;min-height:590px;border:1px solid #e2ece8;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(30,54,73,.035)}
.sw-sl-chat-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid #edf2ef}
.sw-sl-coach{display:flex;align-items:center;gap:10px}
.sw-sl-avatar{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:#e8f6f0;color:#198b78}
.sw-sl-avatar svg{width:21px;height:21px}
.sw-sl-coach strong{display:block;font-size:14px;color:#264c4c}
.sw-sl-coach small{display:block;color:#8ba099;font-size:11px}
.sw-sl-chat-scroll{padding:20px;display:flex;flex-direction:column;gap:15px;flex:1;min-height:300px;max-height:calc(100vh - 370px);overflow:auto;background:linear-gradient(180deg,#fbfdfc,#fff)}
.sw-sl-message{display:flex;gap:9px;align-items:flex-start;max-width:88%}
.sw-sl-message.user{align-self:flex-end;flex-direction:row-reverse}
.sw-sl-bubble{padding:12px 15px;border-radius:15px 15px 15px 5px;background:#f0f7f3;color:#345c53;font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.sw-sl-message.user .sw-sl-bubble{background:#eaf1ff;color:#38527c;border-radius:15px 15px 5px 15px}
.sw-sl-message-avatar{width:29px;height:29px;flex:none;display:grid;place-items:center;border-radius:10px;background:#e8f6f0;color:#198b78}
.sw-sl-message.user .sw-sl-message-avatar{background:#eef2fc;color:#6980c4}
.sw-sl-message-avatar svg{width:15px;height:15px}
.sw-sl-feedback{margin:9px 0 0 38px;padding:14px;border:1px solid #dcece4;border-radius:13px;background:#fbfefc;color:#56756b;font-size:12.5px;line-height:1.65}
.sw-sl-feedback h4{margin:0 0 7px;color:#287563;font-size:12px;display:flex;align-items:center;gap:7px}
.sw-sl-feedback p{margin:5px 0}
.sw-sl-feedback .sw-sl-chip{display:inline-flex;padding:4px 8px;margin:3px 4px 2px 0;border-radius:20px;background:#eaf6ef;color:#277763;font-size:11px;font-weight:750}
.sw-sl-correction{padding:9px 10px;margin:7px 0;border-radius:9px;background:#fff8ef;border:1px solid #f4e8d5}
.sw-sl-correction del{color:#a96c57}.sw-sl-correction strong{color:#267761}
.sw-sl-opportunity{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:8px 0;border-top:1px solid #eaf1ec}
.sw-sl-opportunity strong{color:#236e5d}
.sw-sl-opportunity small{color:#78938a}
.sw-sl-revision{padding:10px 12px;margin-top:9px;border-left:3px solid #4ca98d;background:#f0f8f3;border-radius:0 9px 9px 0;color:#365f52;font-style:italic}
.sw-sl-composer{padding:13px 15px;border-top:1px solid #eaf0ed;background:#fff}
.sw-sl-composer textarea{display:block;width:100%;min-height:67px;max-height:150px;resize:vertical;border:1px solid #dce8e2;border-radius:12px;padding:11px 13px;color:#294d4b;font-size:14px;line-height:1.55;outline-color:#b4ded3}
.sw-sl-composer-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;flex-wrap:wrap}
.sw-sl-actions-left,.sw-sl-actions-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sw-sl-mic{border:1px solid #dce8e2;background:#fff;color:#47786b;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:750;display:inline-flex;align-items:center;gap:7px}
.sw-sl-mic.recording{background:#fff0ee;border-color:#f1c8c0;color:#b75d50}
.sw-sl-note{font-size:10.5px;color:#98aaa2;margin-top:8px}
.sw-sl-side{display:flex;flex-direction:column;gap:12px}
.sw-sl-side-card{padding:17px;border:1px solid #e2ece8;background:#fff;border-radius:16px}
.sw-sl-side-card h3{font-size:13px;color:#315d53;margin:0 0 8px;display:flex;align-items:center;gap:7px}
.sw-sl-side-card p{font-size:12px;color:#81978f;line-height:1.65;margin:0}
.sw-sl-starter{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.sw-sl-starter button{border:1px solid #dfece5;border-radius:20px;background:#f8fcf9;color:#548073;padding:7px 9px;font-size:11px;text-align:left}
.sw-sl-empty{padding:28px 18px;text-align:center;color:#829990}
.sw-sl-empty .sw-sl-avatar{margin:0 auto 12px;width:48px;height:48px}
.sw-sl-empty h3{font-size:16px;color:#315d53;margin:0 0 5px}
.sw-sl-empty p{max-width:430px;margin:0 auto;color:#81978f;font-size:12.5px;line-height:1.7}
.sw-sl-typing{color:#829990;font-size:12px;padding:6px 0}
.sw-sl-error{padding:10px 12px;margin:0 0 9px;border-radius:10px;background:#fff3ef;color:#a75c47;font-size:12px;white-space:pre-wrap}
.sw-sl-transcript{font-size:11px;color:#78928a;margin:0 0 6px;font-style:italic}
@media(max-width:1000px){.sw-sl-shell{grid-template-columns:1fr}.sw-sl-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.sw-sl-chat-scroll{max-height:55vh}}
@media(max-width:650px){.sw-sl-head{display:block}.sw-sl-status{display:inline-flex;margin-top:12px}.sw-sl-side{grid-template-columns:1fr}.sw-sl-chat{min-height:560px}.sw-sl-chat-scroll{padding:14px;max-height:52vh}.sw-sl-message{max-width:96%}.sw-sl-feedback{margin-left:0}.sw-sl-toolbar{padding:10px}.sw-sl-field{min-width:130px}.sw-sl-composer{padding:10px}.sw-sl-actions-right{margin-left:auto}}


/* Speaking Lab — stronger conversation focus and readable type */

/* v4.8 collocation checklist: same height as the Coach AI panel, scrolls when longer */
.sw-sl-side{position:relative;min-height:0}
.sw-sl-targets-card{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;padding:0!important}
.sw-sl-targets-head{flex:0 0 auto;padding:18px 18px 12px;border-bottom:1px solid #e2ece8;background:#fff}
.sw-sl-targets-head h3{margin:0 0 8px!important}
.sw-sl-targets-head .sw-sl-target-topic{margin:0!important}
.sw-sl-targets-head [data-used-count]{white-space:nowrap}
.sw-sl-target-hint{margin:8px 0 0!important;font-size:14px!important;line-height:1.55;color:#6b8a80}
.sw-sl-targets-card .sw-sl-target-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px 18px;align-content:start}
.sw-sl-targets-card .sw-sl-target-empty{padding:16px 18px;overflow-y:auto}
.sw-sl-target-list li.sw-sl-target{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw-sl-target-text{display:grid;gap:3px;min-width:0}
.sw-sl-target-check{flex:0 0 auto;width:24px;height:24px;margin:0;accent-color:#1d7a64;cursor:pointer}
.sw-sl-target.is-used{background:#eef3f1;border-color:#d6e2dd}
.sw-sl-target.is-used strong{color:#7a948b;text-decoration:line-through;text-decoration-thickness:1px}
.sw-sl-target.is-used span{opacity:.75}
@media (max-width:1000px){
  .sw-sl-side{display:block}
  .sw-sl-targets-card{position:static;max-height:480px}
}

 lý khối lượng công việc lớn","example":"I find it challenging to handle a heavy workload during busy weeks.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-003","topicId":"work-business","phrase":"maintain a healthy work-life balance","ipa":"/meɪnˈteɪn ə ˈhelθi ˌwɜːk laɪf ˈbæləns/","meaning":"duy trì cân bằng lành mạnh giữa công việc và cuộc sống","example":"I try to maintain a healthy work-life balance by making time for family.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-004","topicId":"work-business","phrase":"take responsibility for something","ipa":"/teɪk rɪˌspɒnsəˈbɪləti fə ˈsʌmθɪŋ/","meaning":"chịu trách nhiệm về việc gì","example":"I take responsibility for preparing the learning materials.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-005","topicId":"work-business","phrase":"work independently","ipa":"/wɜːk ˌɪndɪˈpendəntli/","meaning":"làm việc độc lập","example":"I prefer to work independently when I need to concentrate.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-006","topicId":"work-business","phrase":"collaborate with colleagues","ipa":"/kəˈlæbəreɪt wɪð ˈkɒliːɡz/","meaning":"hợp tác với đồng nghiệp","example":"I collaborate with colleagues on larger projects.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-007","topicId":"work-business","phrase":"complete tasks on time","ipa":"/kəmˈpliːt tɑːsks ɒn taɪm/","meaning":"hoàn thành nhiệm vụ đúng hạn","example":"A to-do list helps me complete tasks on time.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-008","topicId":"work-business","phrase":"stay on track","ipa":"/steɪ ɒn træk/","meaning":"đi đúng tiến độ, không chệch hướng","example":"Clear goals help our team stay on track.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-009","topicId":"teamwork","phrase":"set clear and specific goals","ipa":"/set klɪə ən spəˈsɪfɪk ɡəʊlz/","meaning":"đặt mục tiêu rõ ràng và cụ thể","example":"Our manager sets clear and specific goals for the team.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-010","topicId":"teamwork","phrase":"provide clear guidance","ipa":"/prəˈvaɪd klɪə ˈɡaɪdəns/","meaning":"đưa ra hướng dẫn rõ ràng","example":"A good leader provides clear guidance when things get complicated.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-011","topicId":"teamwork","phrase":"support each other","ipa":"/səˈpɔːt iːtʃ ˈʌðə/","meaning":"hỗ trợ lẫn nhau","example":"We support each other when deadlines are approaching.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-012","topicId":"teamwork","phrase":"work as part of a team","ipa":"/wɜːk əz pɑːt əv ə tiːm/","meaning":"làm việc trong một nhóm","example":"I enjoy working as part of a team on creative projects.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-013","topicId":"teamwork","phrase":"communicate effectively","ipa":"/kəˈmjuːnɪkeɪt ɪˈfektɪvli/","meaning":"giao tiếp hiệu quả","example":"We need to communicate effectively to avoid misunderstandings.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-014","topicId":"teamwork","phrase":"give constructive feedback","ipa":"/ɡɪv kənˈstrʌktɪv ˈfiːdbæk/","meaning":"đưa ra phản hồi mang tính xây dựng","example":"My colleagues give constructive feedback on my lesson plans.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-015","topicId":"teamwork","phrase":"achieve positive results","ipa":"/əˈtʃiːv ˈpɒzətɪv rɪˈzʌlts/","meaning":"đạt kết quả tích cực","example":"Working together helped us achieve positive results.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-016","topicId":"teamwork","phrase":"rely on colleagues for support","ipa":"/rɪˈlaɪ ɒn ˈkɒliːɡz fə səˈpɔːt/","meaning":"nhờ cậy sự hỗ trợ từ đồng nghiệp","example":"I can rely on colleagues for support when I face a difficult task.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-017","topicId":"daily-routines","phrase":"get into the habit of doing something","ipa":"/ɡet ˈɪntuː ðə ˈhæbɪt əv ˈduːɪŋ ˈsʌmθɪŋ/","meaning":"hình thành thói quen làm gì","example":"I have got into the habit of exercising after work.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-018","topicId":"daily-routines","phrase":"work out regularly","ipa":"/wɜːk aʊt ˈreɡjələli/","meaning":"tập luyện thường xuyên","example":"I work out regularly to feel more energetic.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-019","topicId":"daily-routines","phrase":"unwind after a long day","ipa":"/ʌnˈwaɪnd ˈɑːftə ə lɒŋ deɪ/","meaning":"thư giãn sau một ngày dài","example":"Playing the guitar helps me unwind after a long day.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-020","topicId":"daily-routines","phrase":"release stress","ipa":"/rɪˈliːs stres/","meaning":"giải tỏa căng thẳng","example":"Listening to music helps me release stress.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-021","topicId":"daily-routines","phrase":"feel mentally exhausted","ipa":"/fiːl ˈmentəli ɪɡˈzɔːstɪd/","meaning":"cảm thấy kiệt sức về tinh thần","example":"I sometimes feel mentally exhausted after a busy day.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-022","topicId":"daily-routines","phrase":"give someone a sense of satisfaction","ipa":"/ɡɪv ˈsʌmwʌn ə sens əv ˌsætɪsˈfækʃn/","meaning":"mang lại cho ai đó cảm giác hài lòng","example":"Learning a new song gives me a sense of satisfaction.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-023","topicId":"daily-routines","phrase":"sit back and relax","ipa":"/sɪt bæk ən rɪˈlæks/","meaning":"ngồi nghỉ ngơi và thư giãn","example":"At weekends, I like to sit back and relax with a good film.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-024","topicId":"decisions","phrase":"be in two minds about something","ipa":"/bi ɪn tuː maɪndz əˈbaʊt ˈsʌmθɪŋ/","meaning":"phân vân, chưa quyết định về việc gì","example":"I was in two minds about which university course to choose.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-025","topicId":"decisions","phrase":"it comes down to something","ipa":"/ɪt kʌmz daʊn tə ˈsʌmθɪŋ/","meaning":"rốt cuộc phụ thuộc vào điều gì","example":"For me, it comes down to whether I have enough free time.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-026","topicId":"decisions","phrase":"make an important decision","ipa":"/meɪk ən ɪmˈpɔːtənt dɪˈsɪʒn/","meaning":"đưa ra một quyết định quan trọng","example":"I had to make an important decision about my future career.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-027","topicId":"decisions","phrase":"pursue a career in teaching","ipa":"/pəˈsjuː ə kəˈrɪə ɪn ˈtiːtʃɪŋ/","meaning":"theo đuổi sự nghiệp giảng dạy","example":"I decided to pursue a career in teaching because I enjoy helping students.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"base-028","topicId":"decisions","phrase":"have a significant impact on something","ipa":"/hæv ə sɪɡˈnɪfɪkənt ˈɪmpækt ɒn ˈsʌmθɪŋ/","meaning":"có ảnh hưởng đáng kể tới điều gì","example":"My friend's advice had a significant impact on my career choice.","note":"","source":"Tổng hợp từ buổi luyện nói","addedAt":"2026-10-20"},{"id":"extra-001","topicId":"family-relationships","phrase":"spend quality time together","ipa":"","meaning":"   function ensureLabSession(){
    const poolIds=studyPool().map(e=>e.id);
    if(!Array.isArray(ui.labIds))ui.labIds=[];
    if(!ui.labIds.length&&poolIds.length){resetLabSession();return}
    const activeBefore=labCurrentId();
    ui.labIds=ui.labIds.filter(id=>store.entries.some(e=>e.id===id));
    if(activeBefore){
      const activeIndex=ui.labIds.indexOf(activeBefore);
      ui.labAt=activeIndex>=0?activeIndex:Math.min(ui.labAt,ui.labIds.length);
    }
    const current=labCurrentId();
    if(current&&!poolIds.includes(current)){resetLabSession();return}
    if(ui.labAt>ui.labIds.length)ui.labAt=ui.labIds.length;
    syncLabPointers();

  function ensureQuizForCurrent(){

    const pool=studyPool();

  function scoreLabel(score){return score>=85?'Rất tốt':score>=70?'Khá tốt':score>=50?'Cần cải thiện':'Cần luyện thêm'}
  function scoreTone(score){return score>=70?'good':score>=50?'fair':'weak'}
  function highlightAnswer(raw,highlights){
    const str=String(raw||'');const tags=Array(str.length).fill(null);
    for(const item of Array.isArray(highlights)?highlights:[]){
      if(!item||!['good','improve'].includes(item.label)||typeof item.text!=='string'||!item.text.trim())continue;
      const needle=item.text.trim().toLowerCase();let start=0,index;
      while((index=str.toLowerCase().indexOf(needle,start))!==-1){
        for(let j=index;j<index+needle.length;j++){if(item.label==='improve'||!tags[j])tags[j]=item.label}
        start=index+needle.length;
      }
    }
    let result='',segment='',prev=tags[0]||null;
    function flush(){if(!segment)return;result+=prev?`<mark class="ai-highlight ${prev}">${esc(segment)}</mark>`:esc(segment);segment=''}
    for(let i=0;i<str.length;i++){const t=tags[i]||null;if(t!==prev){flush();prev=t}segment+=str[i]}
    flush();return result||'<em>Không có văn bản để đánh dấu.</em>';
  }
  function dimensionRows(result){
    const d=result.dimensions||{};

    if(ui.sentenceMode==='speak'&&Number.isFinite(Number(d.pronunciation)))items.push(['pronunciation','Phát âm (ước lượng)']);
    return items.filter(([k])=>Number.isFinite(Number(d[k]))).map(([k,label])=>{
      const n=Math.max(0,Math.min(100,Number(d[k])));
      return `<div class="ai-dimension"><div><span>${label}</span><b>${Math.round(n)}%</b></div><div class="ai-bar"><i class="${scoreTone(n)}" style="width:${n}%"></i></div></div>`;
    }).join('');
  }

  function cleanupAudio(){
    recordingGeneration++;ui.recordingStopping=false;recordingPurpose='original';
    if(recordingTimer){clearTimeout(recordingTimer);recordingTimer=null}
    const oldRecorder=recorder,oldStream=micStream;
    recorder=null;micStream=null;ui.recording=false;
    if(oldRecorder){
      oldRecorder.ondataavailable=null;oldRecorder.onstop=null;oldRecorder.onerror=null;
      if(oldRecorder.state!=='inactive'){try{oldRecorder.stop()}catch(_){}}
    }
    if(oldStream)oldStream.getTracks().forEach(track=>{try{track.stop()}catch(_){}});

  async function startRecord(purpose='original'){
    if(ui.sentenceBusy||ui.speakingBusy||ui.recording||ui.recordingStopping)return;
    if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Trình duyệt chưa hỗ trợ ghi âm. Hãy mở qua HTTPS/localhost bằng Safari hoặc Chrome mới.');return}
    cleanupAudio();
    const generation=++recordingGeneration;recordingPurpose=purpose;
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      if(generation!==recordingGeneration){stream.getTracks().forEach(track=>track.stop());return}
      micStream=stream;
      const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/ogg'].find(type=>MediaRecorder.isTypeSupported?.(type));
      const rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
      recorder=rec;
      const chunks=[];
      rec.ondataavailable=event=>{if(generation===recordingGeneration&&event.data?.size)chunks.push(event.data)};
      rec.onerror=event=>{
        if(generation!==recordingGeneration)return;
        ui.sentenceError='Lỗi trong quá trình ghi âm: '+(event.error?.message||'Không thể tiếp tục thu âm.');
        cleanupAudio();render();
      };
      rec.onstop=()=>{
        if(generation!==recordingGeneration)return;
        if(recordingTimer){clearTimeout(recordingTimer);recordingTimer=null}
        ui.recordingStopping=false;
        if(micStream===stream)micStream=null;
        stream.getTracks().forEach(track=>{try{track.stop()}catch(_){}});
        if(recorder===rec)recorder=null;
        if(chunks.length){
          ui.audioBlob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
          if(ui.audioUrl)URL.revokeObjectURL(ui.audioUrl);
          ui.audioUrl=URL.createObjectURL(ui.audioBlob);
        }else{
          ui.audioBlob=null;
          ui.sentenceError='Không thu được dữ liệu âm thanh. Hãy kiểm tra quyền microphone rồi thử lại.';
        }
        ui.recording=false;
        if(ui.view==='apply'||ui.view==='journey'||ui.view==='speakingLab')render();
      };
      rec.start();ui.recording=true;ui.recordingStopping=false;ui.sentenceError=null;render();
      recordingTimer=setTimeout(()=>{if(generation===recordingGeneration&&rec.state==='recording')stopRecord()},45000);
    }catch(err){
      if(generation===recordingGeneration){cleanupAudio();ui.recordingStopping=false;}
      toast('Không thể dùng microphone: '+(err?.name==='NotAllowedError'?'Bạn chưa cấp quyền truy cập.':err?.name==='NotFoundError'?'Không tìm thấy microphone.':'Kiểm tra quyền truy cập microphone và kết nối HTTPS.'));
    }
  }
  function stopRecord(){
    const rec=recorder;if(!rec||rec.state!=='recording')return;
    if(recordingTimer){clearTimeout(recordingTimer);recordingTimer=null}
    try{ui.recordingStopping=true;rec.stop();render()}catch(err){ui.recordingStopping=false;ui.sentenceError='Không thể kết thúc bản ghi. Hãy thử lại.';render()}

  const speakingTopicNames=()=>{const names=(store.topics||[]).map(t=>String(t.name||'').trim()).filter(Boolean);return names.length?names:defaultSpeakingTopics};
  function speakingTargetPhrases(topicName,max=12){
    const norm=x=>String(x||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim();
    const wanted=norm(topicName);
    const topicIds=(store.topics||[]).filter(t=>{const n=norm(t.name);return n&&wanted&&(n===wanted||n.includes(wanted)||wanted.includes(n))}).map(t=>t.id);
    let pool=topicIds.length?store.entries.filter(e=>topicIds.includes(e.topicId)):[];
    if(!pool.length&&Array.isArray(ui.labIds)&&ui.labIds.length){const ids=new Set(ui.labIds);pool=store.entries.filter(e=>ids.has(e.id))}
    if(!pool.length)pool=store.entries.slice();
    const usedMap=store.speakingUsed||{};
    const epoch=Number(ui.targetsEpoch)||Date.now();
    const isUsed=e=>!!(usedMap[e.id]&&usedMap[e.id].used);
    // Collocations the learner already used in an EARLIER practice go to the bottom; ticks made in the current practice keep their place until the next one.
    const usedEarlier=e=>{const r=usedMap[e.id];if(!r||!r.used)return false;const t=Date.parse(r.usedAt||r.updatedAt||'');return !Number.isFinite(t)||t<epoch};
    const rank=e=>{const st=stageOf(e.id);return st==='new'?0:st==='recognised'?1:st==='recalled'?2:3};
    return pool.map((e,i)=>({e,i,g:usedEarlier(e)?1:0,r:rank(e)})).sort((a,b)=>a.g-b.g||a.r-b.r||a.i-b.i).slice(0,max)
      .map(({e})=>({id:e.id,phrase:String(e.phrase||'').slice(0,80),meaning:String(e.meaning||'').slice(0,120),used:isUsed(e)})).filter(x=>x.phrase);
  }

  function review(id,rating,meta={}){
    if(!id)return;
    const p=store.progress[id]||{};
    const action=meta.action||(ui.view==='flashcards'?'flashcard':
      ['apply','journey'].includes(ui.view)?(ui.sentenceMode==='speak'?'speak':'write'):
      ui.quizMode==='multiple'?'mcq':'recall');
    const correct=meta.correct===undefined?rating!=='hard':!!meta.correct;
    const previousLevel=Number(p.level)||0;
    const level=action==='spaced-review'
      ?rating==='again'?1:rating==='hard'?Math.max(1,previousLevel):rating==='easy'?Math.min(5,previousLevel+2):Math.min(5,previousLevel+1)
      :correct?Math.min(5,previousLevel+1):1;
    const ev=evidenceFor(id),date=localDay();
    if(['recall','spaced-review'].includes(action)&&correct)ev.recallDays=[...new Set([...ev.recallDays,date])].slice(-20);
    if(['write','speak'].includes(action)&&correct&&Number(meta.score)>=75&&
      Number(meta.targetUsage)>=75&&Number(meta.grammar)>=65&&
      (action!=='speak'||String(meta.transcript||'').trim()))
      ev.applyDays=[...new Set([...ev.applyDays,date])].slice(-20);
    if(!correct)ev.failures=(Number(ev.failures)||0)+1;
    if(action==='mcq'&&correct)ev.mcqCorrect=(Number(ev.mcqCorrect)||0)+1;
    const intervals=[0,1,3,7,14,30];
    store.progress[id]={...p,level,lastReviewed:date,nextReview:addDays(action==='spaced-review'&&rating==='again'?0:intervals[level]),
      reviews:(Number(p.reviews)||0)+1,evidence:ev};
    store.activityDates=[...new Set([...(store.activityDates||[]),date])];
    store.reviewEvents=[...(store.reviewEvents||[]),{
      id:'activity-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9),
      date,entryId:id,action,correct,rating,score:Number.isFinite(Number(meta.score))?Number(meta.score):null
    }].slice(-3000);
    save();
  }

  async function importCollocationsFile(file){
    if(!file)return;
    const extension=(file.name.split('.').pop()||'').toLowerCase();
    if(extension==='json')return importJSON(file);
    if(!['xlsx','xls','csv'].includes(extension)){toast('Định dạng không hỗ trợ. Dùng Excel, CSV hoặc JSON.');return;}
    if(!window.XLSX){toast('Không tải được thư viện đọc Excel. Kiểm tra kết nối rồi thử lại.');return;}
    if(file.size>4*1024*1024){toast('File quá lớn (tối đa 4 MB).');return;}
    try{
      const book=window.XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});
      const sheet=book.Sheets[book.SheetNames.find(n=>n.toLowerCase()==='collocations')||book.SheetNames[0]];
      if(!sheet)throw new Error('File không có sheet dữ liệu.');
      const rows=window.XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false}).slice(0,1000);
      if(!rows.length)throw new Error('File không có hàng dữ liệu.');
      const names=Object.keys(rows[0]);
      if(!['Topic','Collocation','Meaning (VI)','Example (EN)'].every(x=>names.includes(x)))throw new Error('Thiếu cột bắt buộc. Hãy sử dụng file Excel mẫu.');
      let added=0,skipped=0;
      const seen=new Set(store.entries.map(e=>e.topicId+'|'+normalize(e.phrase)));
      for(const row of rows){
        const name=String(row.Topic||'').trim(),phrase=String(row.Collocation||'').trim(),
          meaning=String(row['Meaning (VI)']||'').trim(),example=String(row['Example (EN)']||'').trim();
        if(!name||!phrase||!meaning||!example||phrase.length>180||meaning.length>240||example.length>1000){skipped++;continue;}
        const tid=createCustomTopic(name),key=tid+'|'+normalize(phrase);
        if(seen.has(key)){skipped++;continue;}
        seen.add(key);
        store.entries.push({id:'excel-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9),
          topicId:tid,phrase,meaning,example,ipa:String(row['IPA (optional)']||'').slice(0,200),
          note:String(row['Usage note (optional)']||'').slice(0,600),cefr:String(row['CEFR (optional)']||'').slice(0,2),
          source:'Excel import',addedAt:localDay()});added++;
      }
      save();closeModal();ui.topic='all';goView('topics');
      toast('Đã nhập '+added+' collocations; bỏ qua '+skipped+' hàng trùng/không hợp lệ.');
    }catch(err){toast('Không nhập được Excel: '+(err.message||err));}
  }

  async function importJSON(file){if(!file)return;try{const raw=JSON.parse(await file.text());const payload=Array.isArray(raw)?{entries:raw}:raw;if(!payload||typeof payload!=='object'||!Array.isArray(payload.entries))throw new Error('Thiếu danh sách entries.');const incomingTopics=Array.isArray(payload.topics)?payload.topics.filter(t=>t.id&&t.name&&['life','ielts'].includes(t.section)):[];const allTopics=combine(store.topics,incomingTopics,'id');const ids=new Set(allTopics.map(t=>t.id));let count=0,updated=0;for(const x of payload.entries){if(!x||typeof x.phrase!=='string'||!x.phrase.trim()||typeof x.meaning!=='string'||typeof x.example!=='string'||!ids.has(x.topicId))continue;const id=typeof x.id==='string'&&x.id?x.id:'import-'+Date.now()+'-'+Math.random().toString(36).slice(2,9);const item={id,topicId:x.topicId,phrase:x.phrase.trim(),ipa:String(x.ipa||''),meaning:x.meaning.trim(),example:x.example.trim(),note:String(x.note||''),source:String(x.source||'Cập nhật từ buổi luyện'),addedAt:String(x.addedAt||localDay())};const idx=store.entries.findIndex(e=>e.id===id);if(idx>=0){store.entries[idx]={...store.entries[idx],...item};updated++}else{store.entries.push(item);count++}store.deletedIds=store.deletedIds.filter(d=>d!==id)}store.topics=allTopics;if(Array.isArray(payload.deletedIds)){store.deletedIds=[...new Set([...store.deletedIds,...payload.deletedIds])];store.entries=store.entries.filter(x=>!store.deletedIds.includes(x.id));}if(payload.progress&&typeof payload.progress==='object'&&!Array.isArray(payload.progress))store.progress={...store.progress,...payload.progress};if(Array.isArray(payload.sessions))store.sessions=combine(store.sessions,payload.sessions,'id');save();ui.page=1;ui.deck=[];ui.quiz=null;render();toast(`Đã nhập ${count} cụm mới và cập nhật ${updated} cụm.`)}catch(error){toast('File JSON chưa hợp lệ: '+error.message)}finally{document.getElementById('importFile').value=''}}
  // Hash-based routes retain the current screen after a refresh and support Back/Forward.
  let lastHandledHash=null;
  function routePath(){
    if(ui.view==='speakingLab')return '/speaking-lab';
    if(ui.view==='home'||ui.view==='mistakes')return '/home'+(ui.homeTab==='overview'?'':'/'+ui.homeTab);
    if(ui.view==='topics')return '/topics'+(ui.topic==='all'?'':'/'+encodeURIComponent(ui.topic));
    if(['flashcards','memory','apply','review'].includes(ui.view)){
      const step={flashcards:'learn',memory:'recall',apply:'apply',review:'review'}[ui.view];
      return '/learning-lab/'+step+(ui.view==='memory'?'/'+(ui.quizMode==='recall'?'type':'multiple'):'')+
        (ui.view==='apply'?'/'+(ui.sentenceMode==='speak'?'speak':'write'):'');
    }
    if(ui.view==='journey')return '/journey';
    return '/home';
  }
  function writeRoute(replace=false){
    const next='#'+routePath();
    if(window.location.hash===next){lastHandledHash=next;return;}
    if(window.history?.pushState){
      if(replace)window.history.replaceState(null,'',next);
      else window.history.pushState(null,'',next);
    }else window.location.hash=next;
    lastHandledHash=next;
  }
  function openHomeTab(name){
    ui.homeTab=['overview','mistakes','mastery'].includes(name)?name:'overview';
    goView('home');
  }
  function readRoute(){
    const currentHash=String(window.location.hash||'');
    if(lastHandledHash===currentHash)return;
    lastHandledHash=currentHash;
    const hash=currentHash.replace(/^#/,'');
    const raw=hash.startsWith('/')?hash:hash==='library'?'/topics':
      (hash==='quiz'||hash==='memory')?'/flashcards/memory/multiple':
      hash?'/'+hash:'/home';
    const parts=raw.split('/').filter(Boolean);
    const main=parts[0];
    if(main==='speaking-lab'){goView('speakingLab',{fromRoute:true})}
    else if(main==='home'){
      ui.homeTab=['mistakes','mastery'].includes(parts[1])?parts[1]:'overview';
      goView('home',{fromRoute:true});
    }else if(main==='topics'){
      let id='all';if(parts[1]){try{id=decodeURIComponent(parts[1])}catch(_){}}
      ui.topic=store.topics.some(t=>t.id===id)?id:'all';
      ui.section='all';ui.page=1;ui.filter='all';ui.query='';
      goView('topics',{fromRoute:true});
    }else if(main==='learning-lab'){
      const step=parts[1]||'learn';
      if(step==='recall'){ui.quizMode=parts[2]==='type'?'recall':'multiple';goView('memory',{fromRoute:true})}
      else if(step==='apply'){ui.sentenceMode=parts[2]==='speak'?'speak':'write';goView('apply',{fromRoute:true})}
      else if(step==='review')goView('review',{fromRoute:true});
      else goView('flashcards',{fromRoute:true});
    }else if(main==='flashcards'){
      if(parts[1]==='memory'){ui.quizMode=parts[2]==='recall'?'recall':'multiple';goView('memory',{fromRoute:true})}
      else goView('flashcards',{fromRoute:true});
    }else if(main==='apply'){
      ui.sentenceMode=parts[1]==='speak'?'speak':'write';
      goView('apply',{fromRoute:true});
    }else if(main==='journey'&&store.learningJourney?.ids?.length){
      resumeJourney({fromRoute:true});
    }else{
      ui.homeTab='overview';
      goView('home',{fromRoute:true});
    }
    writeRoute(true);
  }
  function goView(v,{fromRoute=false}={}){if(['apply','journey','speakingLab'].includes(ui.view)&&v!==ui.view)cleanupAudio();ui.focusMode=false;ui.view=v;
    if(['flashcards','memory','apply','review'].includes(v)){
      if(v==='apply')ui.quizMode='sentence';
      else if(v==='memory'&&ui.quizMode==='sentence')ui.quizMode='multiple';
      ensureLabSession();
      if(v==='memory'||v==='apply')ensureQuizForCurrent();
    }
    if(['flashcards','memory','apply','review'].includes(v)){store.lastPractice={view:v,date:localDay()};save()}
    render();if(!fromRoute)writeRoute();
    document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileShade').classList.remove('open');
    window.scrollTo({top:0,behavior:'smooth'})}
  document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-nav]');if(nav){
      if(nav.dataset.nav==='topics'){ui.topic='all';ui.section='all';ui.filter='all';ui.query='';ui.page=1}
      if(nav.dataset.nav==='home')ui.homeTab='overview';
      goView(nav.dataset.nav);return
    }
    const el=e.target.closest('[data-action]');if(!el)return;
    const {action,id,section,topic:topicId,page,rating,mode}=el.dataset;
    switch(action){
      case 'saveMistake':saveCurrentMistake();break;
      case 'openMistakes':openHomeTab('mistakes');break;
      case 'openMastery':openHomeTab('mastery');break;
      case 'homeTab':openHomeTab(el.dataset.tab);break;
      case 'masteryTopic':ui.topic=topicId;ui.section='all';goView('topics');break;
      case 'studyTab':goView(({learn:'flashcards',recall:'memory',apply:'apply',review:'review',cards:'flashcards',memory:'memory'})[mode]||'flashcards');break;
      case 'retryMistake':retryMistake(id);break;
      case 'deleteMistake':{
        if(confirm('Xoá vĩnh viễn lỗi đã lưu này?')){
          store.deletedMistakeIds=[...new Set([...(store.deletedMistakeIds||[]),id])];
          store.mistakes=store.mistakes.filter(m=>m.id!==id);save();render();toast('Đã xoá lỗi đã lưu.');
        }break;
      }
      case 'toggleMistake':{const m=store.mistakes.find(x=>x.id===id);if(m){m.status=m.status==='resolved'?'open':'resolved';m.updatedAt=new Date().toISOString();save();render()}break}
      case 'toggleFocus':toggleFocus();break;
      case 'journeyAdvance':journeyNext();break;
      case 'journeySkipRecall':journeyCheckRecall('',true);break;
      case 'startToday':startJourney(recommendation(Number(store.settings.dailyGoal)||8));break;
      case 'resumeJourney':resumeJourney();break;
      case 'entryTab':entryModal(null,el.dataset.tab);break;
      case 'selectExcel':document.getElementById('importFile').click();break;
      case 'downloadTemplate':downloadTemplate();break;
      case 'saveAIDrafts':saveAIDrafts();break;
      case 'toggleGroup':collapsedGroups[section]=!collapsedGroups[section];try{localStorage.setItem(GROUPS_KEY,JSON.stringify(collapsedGroups))}catch(_){}sidebar();break;
      case 'section':ui.section='all';ui.topic='all';ui.page=1;ui.view='topics';render();writeRoute();break;
      case 'topic':{
        const wasSelected=ui.topic===topicId&&ui.view==='topics';
        ui.topic=wasSelected?'all':topicId;ui.section='all';ui.filter='all';ui.query='';ui.page=1;ui.view='topics';render();writeRoute();
        if(!wasSelected)document.getElementById('selectedTopicCollocations')?.scrollIntoView({behavior:'smooth',block:'start'});
        break;
      }
      case 'clearFilters':ui.section='all';ui.topic='all';ui.filter='all';ui.query='';ui.page=1;render();writeRoute();break;
      case 'page':ui.page=Number(page);libraryTable();break;
      case 'detail':openDrawer(id);break;
      case 'closeDrawer':closeDrawer();break;
      case 'closeModal':closeModal();break;
      case 'speak':speak(id);break;
      case 'star':toggleStar(id);break;
      case 'edit':entryModal(id);break;
      case 'delete':if(confirm('Bạn có chắc muốn xoá collocation này khỏi thư viện?')){store.entries=store.entries.filter(x=>x.id!==id);store.deletedIds.push(id);delete store.progress[id];save();closeDrawer();render();toast('Đã xoá cụm từ.')}break;
      case 'flip':ui.flipped=!ui.flipped;render();break;
      case 'rate':{const currentId=labCurrentId();if(currentId)review(currentId,rating,{action:'flashcard',correct:rating!=='hard'});advanceLab();render();break;}
      case 'restart':resetLabSession();render();break;
      case 'quizMode':cleanupAudio();ui.quizMode=mode;ui.quiz=null;ui.quizSeen=[];ui.quizTotal=0;ui.quizCorrect=0;ui.sentenceResult=null;ui.sentenceError=null;render();writeRoute();break;
      case 'sentenceMode':cleanupAudio();ui.sentenceMode=mode;ui.sentenceResult=null;ui.sentenceOriginalResult=null;ui.sentenceRevisionText='';ui.sentenceRevisionResult=null;ui.sentenceError=null;ui.hintResult=null;ui.hintError=null;render();writeRoute();break;
      case 'saveEndpoint':{
        const value=document.getElementById('aiEndpoint')?.value.trim()||'';
        if(value){
          let url;try{url=new URL(value)}catch(_){toast('Địa chỉ AI không hợp lệ.');break}
          if(!(url.protocol==='https:'||(url.protocol==='http:'&&url.hostname==='localhost'))||url.pathname!=='/evaluate'){
            toast('Địa chỉ AI cần sử dụng HTTPS và kết thúc bằng /evaluate.');break;
          }
        }
        endpointOverride=value;aiEndpoint=endpointOverride||defaultAiEndpoint;
        try{if(value)localStorage.setItem(ENDPOINT_KEY,value);else localStorage.removeItem(ENDPOINT_KEY)}catch(_){}
        render();verifyAiService();toast(value?'Đã lưu địa chỉ AI tùy chỉnh.':'Đã sử dụng kết nối tự động.');break;
      }
      case 'resetEndpoint':{
        endpointOverride='';aiEndpoint=defaultAiEndpoint;
        try{localStorage.removeItem(ENDPOINT_KEY)}catch(_){}
        render();verifyAiService();toast('Đã sử dụng Worker Speakwise mặc định.');break;
      }
      case 'retryAiService':verifyAiService();break;
      case 'startRecord':startRecord('original');break;
      case 'startRevisionRecord':startRecord('revision');break;
      case 'sendSpeakingAudio':sendSpeakingTurn('speak');break;
      case 'discardSpeakingAudio':cleanupAudio();render();break;
      case 'newSpeakingChat':cleanupAudio();ui.targetsEpoch=Date.now();ui.speakingStarted=false;ui.speakingMessages=[];ui.speakingInput='';ui.speakingError=null;ui.speakingLastReply='';render();break;
      case 'startSpeakingChat':startSpeakingConversation();break;
      case 'speakingStarter':ui.speakingInput=el.dataset.prompt||'';render();document.getElementById('speakingInput')?.focus();break;
      case 'speakReply':speakSpeakingReply();break;
      case 'stopRecord':stopRecord();break;
      case 'evaluateSentence':evaluateSentence();break;
      case 'evaluateRevision':evaluateRevision();break;
      case 'requestHint':requestAIHint();break;
      case 'reviewReveal':ui.reviewRevealed=true;render();break;
      case 'reviewAll':ui.quizScope='learned';resetLabSession();render();break;
      case 'reviewRestart':resetLabSession();render();break;
      case 'reviewRate':{
        const currentId=labCurrentId();
        const correct=!['again','hard'].includes(rating);
        if(currentId)review(currentId,rating,{action:'spaced-review',correct});
        advanceLab();render();break;
      }
      case 'skipSentence':nextQuiz();render();break;
      case 'quizAnswer':quizAnswer(id);break;
      case 'nextQuiz':nextQuiz();render();break;
      case 'revealQuiz':checkRecall('',true);break;
    }
  });
  document.addEventListener('input',e=>{if(e.target.id==='searchInput'){ui.query=e.target.value;ui.page=1;libraryTable()}if(e.target.id==='recallInput')ui.recallText=e.target.value;if(e.target.id==='sentenceInput')ui.sentenceText=e.target.value;if(e.target.id==='sentenceRevisionInput')ui.sentenceRevisionText=e.target.value;if(e.target.id==='speakingInput')ui.speakingInput=e.target.value});
  document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('sw-sl-target-check')){toggleSpeakingUsed(e.target.dataset.usedId,e.target.checked,e.target);return}if(e.target.id==='statusFilter'){ui.filter=e.target.value;ui.page=1;libraryTable()}if(e.target.id==='practiceTopic'||e.target.id==='practiceScope'){ui.quizTopic=document.getElementById('practiceTopic').value;ui.quizScope=document.getElementById('practiceScope').value;resetLabSession();render()}if(e.target.id==='dailyGoalSelect'){store.settings.dailyGoal=Number(e.target.value)||8;save();render()}if(e.target.id==='slTopic'&&ui.speakingTopic!==e.target.value){ui.speakingTopic=e.target.value;ui.targetsEpoch=Date.now();cleanupAudio();ui.speakingStarted=false;ui.speakingMessages=[];ui.speakingLastReply='';ui.speakingError=null;render()}if(e.target.id==='slLevel'&&ui.speakingLevel!==e.target.value){ui.speakingLevel=e.target.value;ui.targetsEpoch=Date.now();cleanupAudio();ui.speakingStarted=false;ui.speakingMessages=[];ui.speakingLastReply='';ui.speakingError=null;render()}if(e.target.id==='entryTopic')updateFormTopics();if(e.target.id==='aiTopicSelect'){const box=document.getElementById('aiNewTopicField');if(box)box.hidden=e.target.value!=='__new__'}});
  document.addEventListener('submit',e=>{if(e.target.id==='entryForm'){e.preventDefault();saveEntry(e.target)}if(e.target.id==='recallForm'){e.preventDefault();checkRecall(ui.recallText)}if(e.target.id==='aiCreateForm'){e.preventDefault();generateCollocations()}if(e.target.id==='journeyRecallForm'){e.preventDefault();journeyCheckRecall(document.getElementById('journeyRecallInput')?.value||'')}if(e.target.id==='speakingForm'){e.preventDefault();sendSpeakingTurn('text')}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal();document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileShade').classList.remove('open')}if(e.key===' '&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)&&!ui.modal&&!ui.drawer&&ui.view==='flashcards'){e.preventDefault();if(ui.deck[ui.deckAt]){ui.flipped=!ui.flipped;render()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-action="detail"]')){e.preventDefault();openDrawer(e.target.dataset.id)}if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('flashcard')&&ui.view==='flashcards'){e.preventDefault();ui.flipped=!ui.flipped;render()}});
  document.getElementById('addBtn').addEventListener('click',()=>entryModal());
  document.getElementById('importFile').addEventListener('change',e=>{importCollocationsFile(e.target.files?.[0]);e.target.value='';});
  document.getElementById('menuToggle').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('mobileShade').classList.add('open')});
  document.getElementById('mobileShade').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileShade').classList.remove('open')});
  document.getElementById('brandLink').addEventListener('click',e=>{e.preventDefault();ui.homeTab='overview';ui.section='all';ui.topic='all';goView('home')});
  window.addEventListener('popstate',readRoute);
  window.addEventListener('hashchange',readRoute);
  readRoute();
  verifyAiService();
  window.SpeakwiseSync?.init({store,render,toast});
})();

</script>
