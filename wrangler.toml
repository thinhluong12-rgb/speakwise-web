name = "speakwise-studio"
main = "ai-worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/evaluate", "/health"]

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_FALLBACK_MODEL = "gemini-3.8-flash"

# Preview deployments need their own non-secret vars and Workers AI binding.
[previews.vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_FALLBACK_MODEL = "gemini-3.8-flash"

# Cloudflare Workers AI is the fallback provider for Learning Lab idea hints.
[ai]
binding = "AI"

[previews.ai]
binding = "AI"

# GEMINI_API_KEY remains required for /evaluate and /generate.
